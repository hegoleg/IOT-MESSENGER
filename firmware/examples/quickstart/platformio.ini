; Quickstart firmware for the web flasher.
; It has no secrets baked in: Wi-Fi, token and relay are provisioned over USB.
;
;   pio run -e nodemcuv2 -e esp32dev

[platformio]
default_envs = nodemcuv2

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    symlink://../..
    bblanchon/ArduinoJson@^7.0.0
    links2004/WebSockets@^2.4.0

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2

[env:esp32dev]
platform = espressif32
board = esp32dev
