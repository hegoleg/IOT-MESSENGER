services:
  relay:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: iot-messenger-relay:latest
    restart: unless-stopped
    env_file:
      - server/.env
    ports:
      # Keep the relay on loopback and put Caddy or Cloudflare Tunnel in front.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./server/data:/app/data
